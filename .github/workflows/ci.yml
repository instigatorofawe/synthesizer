name: CI

# Milestones reach main as squashed pull requests, and those are the only thing that runs CI.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4 # With Makefiles a bare --parallel means unlimited jobs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The append-only check compares with the base branch
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      - run: python3 tools/CheckAppendOnly.py "origin/$GITHUB_BASE_REF"
      - name: Read the golden images from the specification alone
        run: |
          python3 tools/ReadImage.py --coverage \
            golden/Minimal.image golden/Demo.image golden/AllOps.image golden/Waves.image golden/Tones.image \
            golden/AllOps32.image golden/Demo32.image golden/Waves32.image golden/Tones32.image
          python3 tools/ReadImage.py --example golden/Minimal.image

  native:
    name: native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, os: ubuntu-latest, cxx: g++ }
          - { name: clang, os: ubuntu-latest, cxx: clang++ }
          - { name: macos, os: macos-latest, cxx: clang++ }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build -DMODSYNTH_BUILD_BENCH=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix install

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13
      - run: emcmake cmake -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The same headers cross-compiled for Cortex-M4, run on QEMU's L475, and compared with a native render.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm ninja-build
      - run: firmware/Check.sh
        env:
          FUZZ_SECONDS: 60
          FUZZ_RANDOM: ${{ github.run_id }}

  # Coverage-guided, with sanitizers, from the golden images. Each run takes a new random seed, and prints it, so CI explores
  # further every time and a failure prints a recipe that replays anywhere.
  fuzz:
    name: fuzz (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: desktop, configure: cmake, binary: build/modsynth_fuzz }
          - { name: wasm32, configure: emcmake cmake, binary: node build/modsynth_fuzz.js }
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        if: matrix.name == 'wasm32'
        with:
          version: 6.0.13
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-rt-dev
        if: matrix.name == 'desktop'
      - run: >-
          ${{ matrix.configure }} -B build -DMODSYNTH_BUILD_FUZZ=ON -DMODSYNTH_BUILD_TESTS=OFF
          -DMODSYNTH_BUILD_COMPILER=OFF -DMODSYNTH_INSTALL=OFF
      - run: cmake --build build --target modsynth_fuzz
      - run: >-
          ${{ matrix.binary }} 90 ${{ github.run_id }}
          golden/AllOps.image golden/Demo.image golden/Waves.image golden/Tones.image
          golden/AllOps32.image golden/Demo32.image golden/Waves32.image golden/Tones32.image
        env:
          ASAN_OPTIONS: detect_leaks=0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13
      - run: emcmake cmake -S .. -B ../build/wasm -DMODSYNTH_BUILD_TESTS=OFF
      - run: cmake --build ../build/wasm --target modsynth_wasm modsynth_compiler_wasm
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm wasm
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      UV_PYTHON_PREFERENCE: only-managed # A system Python may not have the headers the extension needs
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Import the abi3 wheel on the oldest and newest supported Python
        run: |
          for python in 3.12 3.15; do
            uv run --isolated --no-project --python "$python" --with dist/*.whl python -c "import modsynth"
          done
