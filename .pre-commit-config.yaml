repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents] # pnpm-lock.yaml is one
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++] # By default this also rewrites JSON and JavaScript

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # The web app formats and lints with its own tools at the versions its lockfile pins, so run `pnpm install` in web/ first.
  # Paths arrive from the repository root and the tools run in web/, so each loses its leading `web/`.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        language: system
        entry: bash -c 'cd web && exec pnpm exec prettier --write --ignore-unknown "${@#web/}"' --
        files: ^web/
      - id: eslint
        name: eslint (web)
        language: system
        entry: bash -c 'cd web && exec pnpm exec eslint --fix --max-warnings 0 --no-warn-ignored "${@#web/}"' --
        files: ^web/.*\.(js|ts|svelte)$
