[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "modsynth"
dynamic = ["version"]
description = "Synthesizer library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2"]
authors = [{ name = "Ran Liu" }]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/modsynth"]
wheel.py-api = "cp312" # One wheel per platform, for every CPython >= 3.12
install.components = ["python"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(modsynth VERSION (?P<value>[0-9.]+)'

[tool.uv]
# uv only rebuilds a project when these change, and by default that excludes the C++
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "bindings/**" },
    { file = "include/**" },
]
